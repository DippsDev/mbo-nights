  <head>

    <meta name="description" content="Live nights across Gaborone — new acts, real rooms, and the next song always coming. MBO books live music across Botswana." />

    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MBO — More Bands On the way" />
    <meta property="og:title" content="MBO — More Bands On the way" />
    <meta property="og:description" content="Live nights across Gaborone — new acts, real rooms, and the next song always coming." />
    <meta property="og:url" content="https://morebandsontheway.com/" />
    <meta property="og:image" content="https://morebandsontheway.com/IMG_1990-scaled.jpeg" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1425" />
    <meta property="og:locale" content="en_BW" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MBO — More Bands On the way" />
    <meta name="twitter:description" content="Live nights across Gaborone — new acts, real rooms, and the next song always coming." />
    <meta name="twitter:image" content="https://morebandsontheway.com/IMG_1990-scaled.jpeg" />
    <script>
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
      window.scrollTo(0, 0)
    </script>
    <script>
      ;(function () {
        var mobile = window.matchMedia('(max-width: 799px)').matches
        var poster = mobile ? '/video/DippsDevMobile.jpg' : '/video/DippsDevHero.jpg'
        var clip = mobile ? '/video/DippsDevMobile.mp4' : '/video/DippsDevHero.mp4'
        // No <link rel=preload as=video>: most browsers ignore it, and where they
        // don't it duplicates the fetch() warm-up below.
        ;[
          { rel: 'preload', as: 'image', href: poster, fetchpriority: 'high' },
        ].forEach(function (attrs) {
          var l = document.createElement('link')
          Object.keys(attrs).forEach(function (k) {
            l.setAttribute(k, attrs[k])
          })
          document.head.appendChild(l)
        })
        // Warm HTTP cache for the hero clip before React mounts.
        if (window.fetch) {
          fetch(clip, { credentials: 'same-origin', priority: 'high' }).catch(function () {})
        }
      })()
    </script>
  </head>
  <body>
    <!-- Metadata only until Enter — keeps bandwidth free for the hero clip. -->
    <audio
      id="mbo-sound-bed"
      class="sound-bed"
      src="/audio/DippsDevBed.mp3"
      preload="metadata"
      playsinline
      webkit-playsinline
    ></audio>
    <script>
      ;(function () {
        var a = document.getElementById('mbo-sound-bed')
        if (!a) return
        a.volume = 0
        var ua = navigator.userAgent || ''
        var ios =
          /iPhone|iPad|iPod/i.test(ua) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
        var coarse = window.matchMedia('(pointer: coarse), (hover: none)').matches
        if (ios || coarse) return
        function go() {
          a.preload = 'auto'
          var p = a.play()
          if (p && p.catch) p.catch(function () {})
        }
        a.setAttribute('autoplay', '')
        if (a.readyState >= 2) go()
        else {
          a.addEventListener('canplay', go, { once: true })
          a.addEventListener('loadeddata', go, { once: true })
        }
        // Delay audio fetch slightly so the hero video wins the first bytes.
        window.setTimeout(go, 1200)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
