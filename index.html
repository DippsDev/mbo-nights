<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text x='16' y='22' text-anchor='middle' font-size='14' font-weight='700' fill='%23ffffff' font-family='Arial,sans-serif'>MBO</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MBO — More Bands On the way</title>
    <script>
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
      window.scrollTo(0, 0)
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      ;(function () {
        var mobile = window.matchMedia('(max-width: 799px)').matches
        var poster = mobile ? '/video/DippsDevMobile.jpg' : '/video/DippsDevHero.jpg'
        var clip = mobile ? '/video/DippsDevMobile.mp4' : '/video/DippsDevHero.mp4'
        ;[
          { rel: 'preload', as: 'image', href: poster },
          { rel: 'preload', as: 'video', href: clip, type: 'video/mp4' },
        ].forEach(function (attrs) {
          var l = document.createElement('link')
          Object.keys(attrs).forEach(function (k) {
            l.setAttribute(k, attrs[k])
          })
          document.head.appendChild(l)
        })
        // Warm HTTP cache for the hero clip before React mounts.
        if (window.fetch) {
          fetch(clip, { credentials: 'same-origin', priority: 'high' }).catch(function () {})
        }
      })()
    </script>
  </head>
  <body>
    <!-- Metadata only until Enter — keeps bandwidth free for the hero clip. -->
    <audio
      id="mbo-sound-bed"
      class="sound-bed"
      src="/audio/DippsDev.mp3"
      preload="metadata"
      playsinline
      webkit-playsinline
    ></audio>
    <script>
      ;(function () {
        var a = document.getElementById('mbo-sound-bed')
        if (!a) return
        a.volume = 0
        var ua = navigator.userAgent || ''
        var ios =
          /iPhone|iPad|iPod/i.test(ua) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
        var coarse = window.matchMedia('(pointer: coarse), (hover: none)').matches
        if (ios || coarse) return
        function go() {
          a.preload = 'auto'
          try {
            if (a.readyState >= 1 && a.paused) a.currentTime = 8
          } catch (e) {}
          var p = a.play()
          if (p && p.catch) p.catch(function () {})
        }
        a.setAttribute('autoplay', '')
        if (a.readyState >= 2) go()
        else {
          a.addEventListener('canplay', go, { once: true })
          a.addEventListener('loadeddata', go, { once: true })
        }
        // Delay audio fetch slightly so the hero video wins the first bytes.
        window.setTimeout(go, 1200)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
