<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text x='16' y='22' text-anchor='middle' font-size='14' font-weight='700' fill='%23ffffff' font-family='Arial,sans-serif'>MBO</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MBO — More Bands On the way</title>
    <script>
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
      window.scrollTo(0, 0)
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/IMG_1990-scaled.jpeg" />
    <link
      rel="preload"
      as="video"
      href="/video/DippsDevMobile.mp4"
      type="video/mp4"
      media="(max-width: 799px)"
    />
    <link
      rel="preload"
      as="video"
      href="/video/DippsDevMp4.mp4"
      type="video/mp4"
      media="(min-width: 800px)"
    />
  </head>
  <body>
    <!-- Preload only. Autoplay is desktop-only via React — failed iOS play() poisons unlock. -->
    <audio
      id="mbo-sound-bed"
      class="sound-bed"
      src="/audio/DippsDev.mp3"
      preload="auto"
      playsinline
      webkit-playsinline
    ></audio>
    <script>
      ;(function () {
        var a = document.getElementById('mbo-sound-bed')
        if (!a) return
        a.volume = 0
        var ua = navigator.userAgent || ''
        var ios =
          /iPhone|iPad|iPod/i.test(ua) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
        var coarse = window.matchMedia('(pointer: coarse), (hover: none)').matches
        if (ios || coarse) return
        function go() {
          try {
            if (a.readyState >= 1 && a.paused) a.currentTime = 8
          } catch (e) {}
          var p = a.play()
          if (p && p.catch) p.catch(function () {})
        }
        a.setAttribute('autoplay', '')
        if (a.readyState >= 2) go()
        else {
          a.addEventListener('canplay', go, { once: true })
          a.addEventListener('loadeddata', go, { once: true })
        }
        go()
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
