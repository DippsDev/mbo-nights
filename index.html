<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text x='16' y='22' text-anchor='middle' font-size='14' font-weight='700' fill='%23ffffff' font-family='Arial,sans-serif'>MBO</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MBO — More Bands On the way</title>
    <script>
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
      window.scrollTo(0, 0)
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Starts as early as the browser allows; React adopts this same element. -->
    <audio
      id="mbo-sound-bed"
      class="sound-bed"
      src="/audio/DippsDev.mp3"
      preload="auto"
      autoplay
      playsinline
      webkit-playsinline
    ></audio>
    <script>
      ;(function () {
        var a = document.getElementById('mbo-sound-bed')
        if (!a) return
        a.volume = 0
        var target = 0.55
        var fading = false
        function fade() {
          if (fading) return
          fading = true
          var t0 = performance.now()
          function step(now) {
            var t = Math.min(1, (now - t0) / 5500)
            a.volume = target * t * t * (3 - 2 * t)
            if (t < 1) requestAnimationFrame(step)
            else fading = false
          }
          requestAnimationFrame(step)
        }
        function go() {
          try {
            if (a.readyState >= 1 && a.paused) a.currentTime = 8
          } catch (e) {}
          var p = a.play()
          if (p && p.then) p.then(fade).catch(function () {})
          else if (!a.paused) fade()
        }
        if (a.readyState >= 2) go()
        else {
          a.addEventListener('canplay', go, { once: true })
          a.addEventListener('loadeddata', go, { once: true })
        }
        go()
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
